<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Smart Recipe Making</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background: #f5f7f2;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);

        }


        .logo {

            text-align: center;

            font-size: 40px;

            margin-bottom: 10px;

        }


        h1 {

            text-align: center;

            color: #2e7d32;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            line-height: 1.5;

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

        }


        input:focus {

            outline: none;

            border-color: #2e7d32;

        }


        .submit-btn {

            width: 100%;

            padding: 14px;

            background: #2e7d32;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .submit-btn:hover {

            background: #1b5e20;

        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #777;

            text-decoration: none;

        }


        .back-link:hover {

            color: #2e7d32;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        🍳
    </div>


    <h1>
        Forgot Password?
    </h1>


    <p class="subtitle">

        Enter your registered email address.

        We will send you an OTP to reset your password.

    </p>


    <form
        method="POST"
        action="/forgot-password"
    >


        <label for="email">

            📧 Email Address

        </label>


        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your registered email"
            required
        >


        <button
            type="submit"
            class="submit-btn"
        >

            📩 Send OTP

        </button>


    </form>


    <a
        href="/login"
        class="back-link"
    >

        ← Back to Login

    </a>


</div>


</body>

</html>
