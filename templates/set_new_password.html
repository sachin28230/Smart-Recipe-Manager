<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Set New Password - Smart Recipe Manager</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7f2;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 20px;
        }

        .email {
            text-align: center;
            background: #f5f7f2;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 25px;
            word-break: break-word;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #444;
        }

        .password-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            padding-right: 45px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
        }

        .eye {
            position: absolute;
            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 28px;
            height: 28px;

            border: none;
            background: transparent;

            padding: 3px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #555;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .eye:hover .eye-svg {
            stroke: #2e7d32;
        }

        .reset-button {
            width: 100%;

            padding: 14px;

            background: #2e7d32;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .reset-button:hover {
            background: #1b5e20;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 20px;

            color: #777;
            text-decoration: none;
        }

        .back:hover {
            color: #2e7d32;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        🍳
    </div>


    <h1>
        Set New Password
    </h1>


    <p class="subtitle">
        Create a new password for your account.
    </p>


    <div class="email">

        📧 {{ email }}

    </div>


    <form
        method="POST"
        action="/set-new-password"
    >


        <label>
            🔐 New Password
        </label>


        <div class="password-box">

            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter new password"
                minlength="6"
                required
            >

            <button
                type="button"
                class="eye"
                aria-label="Show password"
                onclick="togglePassword('new_password', this)"
            >
                <svg class="eye-svg" viewBox="0 0 24 24">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="2.5"></circle>
                    <path d="M4 4L20 20"></path>
                </svg>
            </button>

        </div>


        <label>
            🔐 Confirm New Password
        </label>


        <div class="password-box">

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

            <button
                type="button"
                class="eye"
                aria-label="Show password"
                onclick="togglePassword('confirm_password', this)"
            >
                <svg class="eye-svg" viewBox="0 0 24 24">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                    <circle cx="12" cy="12" r="2.5"></circle>
                    <path d="M4 4L20 20"></path>
                </svg>
            </button>

        </div>


        <button
            type="submit"
            class="reset-button"
        >

            🔐 Reset Password

        </button>


    </form>


    <a
        href="/login"
        class="back"
    >

        ← Back to Login

    </a>


</div>


<script>

function eyeSlashSVG() {
    return `
        <svg class="eye-svg" viewBox="0 0 24 24">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="2.5"></circle>
            <path d="M4 4L20 20"></path>
        </svg>
    `;
}

function eyeSVG() {
    return `
        <svg class="eye-svg" viewBox="0 0 24 24">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="2.5"></circle>
        </svg>
    `;
}

function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";

        button.innerHTML = eyeSVG();

        button.setAttribute("aria-label", "Hide password");

    } else {

        input.type = "password";

        button.innerHTML = eyeSlashSVG();

        button.setAttribute("aria-label", "Show password");

    }

}

</script>


</body>

</html>
