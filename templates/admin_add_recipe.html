<!DOCTYPE html>
<html>
<head>

    <title>Add Recipe - Admin</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .navbar {
            background: #5b2c2c;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 800px;
            margin: 35px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #5b2c2c;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .nutrition-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: #5b2c2c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button:hover {
            opacity: 0.9;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            color: #5b2c2c;
            text-decoration: none;
        }

        @media (max-width: 700px) {

            .nutrition-grid {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px 20px;
            }

        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>👨‍💼 Admin Panel</h2>

    <div>
        <a href="/admin">Admin Dashboard</a>
        <a href="/logout">Logout</a>
    </div>

</div>


<div class="container">

    <div class="form-card">

        <div class="header">

            <h1>➕ Add New Recipe</h1>

            <p>
                Enter the recipe details below.
            </p>

        </div>


        <form method="POST">


            <div class="form-group">

                <label>Recipe Name *</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Example: Vegetable Soup"
                    required
                >

            </div>


            <div class="form-group">

                <label>Description *</label>

                <textarea
                    name="description"
                    placeholder="Describe the recipe..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>Ingredients *</label>

                <textarea
                    name="ingredients"
                    placeholder="Example: Tomato, Onion, Garlic, Salt, Oil"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>Preparation Instructions *</label>

                <textarea
                    name="instructions"
                    placeholder="Enter the preparation steps..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>Cooking Time (minutes)</label>

                <input
                    type="number"
                    name="cooking_time"
                    min="0"
                    placeholder="30"
                >

            </div>


            <h3>🍎 Nutrition Information</h3>

            <div class="nutrition-grid">


                <div class="form-group">

                    <label>Calories</label>

                    <input
                        type="number"
                        name="calories"
                        min="0"
                        placeholder="300"
                    >

                </div>


                <div class="form-group">

                    <label>Protein (g)</label>

                    <input
                        type="number"
                        name="protein"
                        min="0"
                        step="0.1"
                        placeholder="10"
                    >

                </div>


                <div class="form-group">

                    <label>Carbohydrates (g)</label>

                    <input
                        type="number"
                        name="carbohydrates"
                        min="0"
                        step="0.1"
                        placeholder="40"
                    >

                </div>


                <div class="form-group">

                    <label>Fat (g)</label>

                    <input
                        type="number"
                        name="fat"
                        min="0"
                        step="0.1"
                        placeholder="8"
                    >

                </div>

            </div>


            <div class="form-group">

                <label>💡 Nutrition Tips</label>

                <textarea
                    name="nutrition_tips"
                    placeholder="Example: Pair with vegetables for a balanced meal."
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                ➕ Add Recipe
            </button>


        </form>


        <a
            class="back-button"
            href="/admin"
        >
            ← Back to Admin Dashboard
        </a>

    </div>

</div>

</body>
</html>
