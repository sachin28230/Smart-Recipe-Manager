<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Recipe Manager
    </title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7f2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1b5e20;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 20px;
            color: #2e7d32;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #777;
            text-decoration: none;
        }

        /* PASSWORD SHOW / HIDE */

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 40%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            padding: 5px;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .show-password:hover {
            background: transparent;
        }

        /* STANDARD EYE ICON */

        .eye-svg {
            width: 22px;
            height: 22px;
            display: block;
            stroke: #555;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .error-message {
    background: #ffebee;
    color: #c62828;
    border: 1px solid #ef9a9a;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 20px;
    text-align: center;
    font-weight: bold;
}

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        🍳
    </div>


    <h1>
        Welcome Back
    </h1>


    <p class="subtitle">
        Login to Smart Recipe Manager
    </p>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="error-message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}

    <form method="POST" action="/login">


        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('loginPassword', this)"
                    aria-label="Show password"
                    title="Show password"
                >

                    <!-- Eye with slash = password hidden -->

                    <svg
                        class="eye-svg"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                        <circle cx="12" cy="12" r="2.5"></circle>
                        <path d="M4 4L20 20"></path>
                    </svg>

                </button>

            </div>

        </div>


        <a
            href="/forgot-password"
            class="forgot"
        >
            🔑 Forgot Password?
        </a>


        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>


    </form>


    <p class="register-link">

        Don't have an account?

        <a href="/register">
            Create Account
        </a>

    </p>


    <a
        href="/"
        class="home-link"
    >
        ← Back to Home
    </a>


</div>


<script>

function eyeOpenSVG() {

    return `
        <svg
            class="eye-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="2.5"></circle>
        </svg>
    `;

}


function eyeSlashSVG() {

    return `
        <svg
            class="eye-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
            <circle cx="12" cy="12" r="2.5"></circle>
            <path d="M4 4L20 20"></path>
        </svg>
    `;

}


function togglePassword(inputId, button) {

    const passwordInput =
        document.getElementById(inputId);

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        button.innerHTML = eyeOpenSVG();

        button.setAttribute("aria-label", "Hide password");
        button.setAttribute("title", "Hide password");

    } else {

        passwordInput.type = "password";

        button.innerHTML = eyeSlashSVG();

        button.setAttribute("aria-label", "Show password");
        button.setAttribute("title", "Show password");

    }

}

</script>


</body>

</html>
