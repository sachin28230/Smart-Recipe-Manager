
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Login - Smart Recipe Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #fff;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 18px;
        }

        .login-container {
            width: 100%;
            max-width: 560px;
            margin: auto;
            padding: 18px 0 12px;
        }

        .brand-logo {
            display: block;
            width: 190px;
            height: auto;
            max-height: 220px;
            object-fit: contain;
            margin: 0 auto 28px;
        }

        h1 {
            text-align: center;
            font-size: clamp(30px, 6vw, 48px);
            font-weight: 500;
            margin-bottom: 22px;
            color: #171717;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: clamp(16px, 3.5vw, 23px);
            line-height: 1.5;
            margin-bottom: 62px;
        }

        .flash-messages {
            margin: -35px 0 24px;
        }

        .flash-message {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 14px;
            background: #ffebee;
            color: #b71c1c;
            border: 1px solid #ffcdd2;
        }

        .field {
            position: relative;
            margin-bottom: 28px;
        }

        .field-icon {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            width: 25px;
            height: 25px;
            color: #444;
            pointer-events: none;
        }

        .field input {
            width: 100%;
            height: 82px;
            border: 1.5px solid #777;
            border-radius: 28px;
            padding: 0 68px 0 82px;
            font-size: 22px;
            color: #222;
            background: #fff;
            outline: none;
        }

        .field input::placeholder {
            color: #777;
            opacity: 1;
        }

        .field input:focus {
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, .12);
        }

        .password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            border: 0;
            background: transparent;
            color: #444;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .password-toggle svg {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .forgot-row {
            text-align: right;
            margin: -2px 12px 42px;
        }

        .forgot-row a,
        .signup-row a {
            color: #52745a;
            text-decoration: none;
            font-size: 18px;
        }

        .forgot-row a:hover,
        .signup-row a:hover {
            text-decoration: underline;
        }

        .primary-btn {
            width: 100%;
            height: 82px;
            border: 0;
            border-radius: 26px;
            background: #4caf50;
            color: #fff;
            font-size: 25px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0, 0, 0, .18);
            transition: background .2s;
        }

        .primary-btn:hover {
            background: #388e3c;
        }

        .signup-row {
            text-align: center;
            margin-top: 88px;
            font-size: 18px;
            color: #333;
        }

        .signup-row a {
            margin-left: 12px;
        }

        @media(max-width:480px) {
            body {
                padding: 22px;
            }

            .login-container {
                max-width: 100%;
                padding-top: 8px;
            }

            .brand-logo {
                width: 165px;
                max-height: 190px;
                margin-bottom: 22px;
            }

            .subtitle {
                margin-bottom: 48px;
            }

            .field {
                margin-bottom: 22px;
            }

            .field input {
                height: 68px;
                border-radius: 23px;
                font-size: 18px;
                padding-left: 68px;
                padding-right: 58px;
            }

            .field-icon {
                left: 21px;
                width: 22px;
                height: 22px;
            }

            .password-toggle {
                right: 15px;
            }

            .forgot-row {
                margin: 0 8px 32px;
            }

            .forgot-row a {
                font-size: 16px;
            }

            .primary-btn {
                height: 68px;
                border-radius: 22px;
                font-size: 21px;
            }

            .signup-row {
                margin-top: 60px;
                font-size: 16px;
            }
        }

        @media(max-height:720px) {
            .brand-logo {
                width: 135px;
                max-height: 150px;
                margin-bottom: 12px;
            }

            h1 {
                margin-bottom: 12px;
            }

            .subtitle {
                margin-bottom: 28px;
            }

            .field {
                margin-bottom: 16px;
            }

            .field input,
            .primary-btn {
                height: 60px;
            }

            .forgot-row {
                margin-bottom: 22px;
            }

            .signup-row {
                margin-top: 35px;
            }
        }
    </style>
</head>

<body>

<main class="login-container">

    <!-- SMART RECIPE MANAGER LOGO -->
    <img
        class="brand-logo"
        src="{{ url_for('static', filename='smart_recipe_manager_logo.png') }}"
        alt="Smart Recipe Manager Logo"
    >

    <h1>Welcome Back!</h1>

    <p class="subtitle">
        Login to continue your delicious journey
    </p>

    <!-- FLASH MESSAGES -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash-message">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- LOGIN FORM -->
    <form method="POST" action="/login">

        <!-- EMAIL -->
        <div class="field">

            <svg class="field-icon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 6-10 7L2 6"></path>

            </svg>

            <input
                type="email"
                name="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

        </div>

        <!-- PASSWORD -->
        <div class="field">

            <svg class="field-icon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8">

                <rect x="3" y="10" width="18" height="12" rx="2"></rect>
                <path d="M7 10V7a5 5 0 0 1 10 0v3"></path>
                <path d="M12 15v2"></path>

            </svg>

            <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="password-toggle"
                onclick="togglePassword()"
                aria-label="Show password"
                title="Show password"
            >

                <svg id="eyeIcon" viewBox="0 0 24 24">

                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>

                    <circle cx="12" cy="12" r="2.5"></circle>

                    <path id="eyeSlash" d="M4 4 20 20"></path>

                </svg>

            </button>

        </div>

        <!-- FORGOT PASSWORD -->
        <div class="forgot-row">
            <a href="/forgot-password">Forgot Password?</a>
        </div>

        <!-- LOGIN BUTTON -->
        <button type="submit" class="primary-btn">
            Login
        </button>

    </form>

    <!-- SIGN UP -->
    <p class="signup-row">
        Don't have an account?
        <a href="/register">Sign Up</a>
    </p>

</main>

<script>

function togglePassword() {

    const input = document.getElementById("loginPassword");
    const slash = document.getElementById("eyeSlash");

    const hidden = input.type === "password";

    input.type = hidden ? "text" : "password";

    slash.style.display = hidden ? "none" : "block";

    const button = document.querySelector(".password-toggle");

    button.setAttribute(
        "aria-label",
        hidden ? "Hide password" : "Show password"
    );

    button.title = hidden ? "Hide password" : "Show password";

}

</script>

</body>
</html>
