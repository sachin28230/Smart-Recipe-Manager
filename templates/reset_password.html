<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - Smart Recipe Manager</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background: #f5f7f2;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);

        }


        .logo {

            text-align: center;

            font-size: 40px;

            margin-bottom: 10px;

        }


        h1 {

            text-align: center;

            color: #2e7d32;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            line-height: 1.5;

            margin-bottom: 25px;

        }


        .email-box {

            background: #f5f7f2;

            padding: 12px;

            border-radius: 7px;

            text-align: center;

            margin-bottom: 25px;

            color: #444;

            word-break: break-word;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 16px;

            text-align: center;

            letter-spacing: 4px;

        }


        input:focus {

            outline: none;

            border-color: #2e7d32;

        }


        .verify-btn {

            width: 100%;

            padding: 14px;

            background: #2e7d32;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .verify-btn:hover {

            background: #1b5e20;

        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #777;

            text-decoration: none;

        }


        .back-link:hover {

            color: #2e7d32;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        🍳
    </div>


    <h1>
        Verify OTP
    </h1>


    <p class="subtitle">

        We have sent a 6-digit OTP to your registered email address.

    </p>


    <div class="email-box">

        📧 {{ email }}

    </div>


    <form
        method="POST"
        action="/reset-password?email={{ email }}"
    >


        <label for="otp">

            🔐 Enter OTP

        </label>


        <input
            type="text"
            id="otp"
            name="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            required
        >


        <button
            type="submit"
            class="verify-btn"
        >

            ✅ Verify OTP

        </button>


    </form>


    <a
        href="/forgot-password"
        class="back-link"
    >

        ← Request New OTP

    </a>


</div>


</body>

</html>
