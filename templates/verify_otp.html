<!DOCTYPE html>
<html>
<head>
    <title>Verify Email - Smart Recipe Making</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .resend {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Verify Your Email</h2>

    <p>Enter the 6-digit OTP sent to:</p>

    <strong>{{ email }}</strong>

    <form method="POST" action="/verify-otp">

        <input
            type="hidden"
            name="email"
            value="{{ email }}"
        >

        <input
            type="text"
            name="otp"
            maxlength="6"
            minlength="6"
            placeholder="Enter 6-digit OTP"
            required
        >

        <br>

        <button type="submit">
            Verify OTP
        </button>

    </form>

    <div class="resend">

        <p>Didn't receive the OTP?</p>

        <a href="/resend-otp?email={{ email }}">
            Resend OTP
        </a>

    </div>

</div>

</body>
</html>
